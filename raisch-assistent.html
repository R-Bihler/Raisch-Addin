<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raisch E-Mail-Assistent</title>
<link rel="icon" type="image/png" href="logo.png">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#efe8e0;--card:#fff;--ink:#1f1b18;--muted:#7a6f66;--line:#e3dbd2;--field:#faf7f3;--edge:#a89a8c;--red:#c8102e;--red-dark:#a30d26;--head:#1c1917;--head-ink:#fff;--head-sub:#b9aea5}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--card:#221e1b;--ink:#f3ede7;--muted:#a89f97;--line:#3a3430;--field:#1a1714;--edge:#6e645b;--red:#e0384f;--red-dark:#c8102e;--head:#0d0b0a;--head-sub:#a89f97}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 Candara,Calibri,"Segoe UI",sans-serif;min-height:100vh}.head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--head);color:var(--head-ink)}.head img{height:46px;width:46px;object-fit:contain;background:#fff;border-radius:50%;flex:none}.head h1{margin:0;font-size:22px;line-height:1.2;font-weight:700}.head p{margin:2px 0 0;font-size:14px;color:var(--head-sub)}main{padding:14px;display:grid;gap:12px}.card{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(31,27,24,.15)}.card.mail{border-left:4px solid var(--red)}.card h2{margin:0 0 8px;font-size:18px}.mailsub{color:var(--muted);font-size:14px;margin-bottom:2px}#mailinfo{font-weight:700;overflow-wrap:anywhere}textarea,input{width:100%;padding:10px;border:2px solid var(--edge);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}textarea{resize:vertical}textarea::placeholder,input::placeholder{color:var(--muted)}textarea:focus,input:focus{border-color:var(--red);outline:none}button:focus-visible{outline:2px solid var(--red);outline-offset:2px}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button{padding:9px 16px;border-radius:8px;border:1px solid var(--red);background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover:not(:disabled){background:var(--red-dark);border-color:var(--red-dark)}button.secondary{background:transparent;color:var(--ink);border:2px solid var(--edge)}button.secondary:hover:not(:disabled){background:var(--field);border-color:var(--muted)}button:disabled{opacity:.45;cursor:default}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{background:var(--field);color:var(--ink);border:2px solid var(--line)}.tab[aria-selected="true"]{background:var(--red);color:#fff;border-color:var(--red)}.hint{font-size:14px;color:var(--muted);margin:0 0 10px}label{display:block;font-weight:700;margin:8px 0 5px}#status{min-height:20px;margin-top:10px;color:var(--muted);font-size:14.5px}#status.error{color:var(--red);font-weight:700}[hidden]{display:none!important}
</style>
</head>
<body>
<header class="head"><img src="logo.png" alt="Bäckerei &amp; Konditorei Raisch" onerror="this.style.display='none'"><div><h1>Raisch Assistent</h1><p>Bäckerei &amp; Konditorei Raisch</p></div></header>
<main>
<section class="card"><div class="tabs" role="tablist" aria-label="Assistentenmodus"><button type="button" id="tab-reply" class="tab" role="tab" aria-selected="true" aria-controls="reply-panel">E-Mail beantworten</button><button type="button" id="tab-create" class="tab" role="tab" aria-selected="false" aria-controls="create-panel">E-Mail erstellen</button></div></section>
<div id="reply-panel" role="tabpanel" aria-labelledby="tab-reply">
<section class="card mail"><div class="mailsub">Ausgewählte Mail</div><div id="mailinfo">Keine Mail ausgewählt</div></section>
<section class="card"><h2>Antwortvorschlag</h2><div class="row" style="margin-top:0;margin-bottom:10px"><button id="create" disabled>Vorschlag erstellen</button></div><textarea id="answer" rows="10" aria-label="Antwortvorschlag"></textarea><div class="row"><button id="open" class="secondary" disabled>Als Antwort öffnen</button><button id="copy" class="secondary" disabled>Kopieren</button></div><div id="status" role="status"></div></section>
<section class="card"><h2>Antwort anpassen <span style="font-size:14px;font-weight:400;color:var(--muted)">(optional)</span></h2><textarea id="keywords" rows="3" aria-label="Optionale Hinweise für die Antwort" placeholder="z. B. kürzer formulieren, 10 € Gutschein anbieten, Abholung Freitag ab 8 Uhr bestätigen"></textarea><div class="row"><button id="adjust" disabled>Antwort anpassen</button></div></section>
</div>
<div id="create-panel" role="tabpanel" aria-labelledby="tab-create" hidden>
<section class="card"><h2>Neue E-Mail</h2><p class="hint">Stichpunkte eingeben – die KI formuliert daraus eine vollständige E-Mail. Bitte alle Angaben vor dem Senden prüfen.</p><label for="new-keywords">Stichpunkte</label><textarea id="new-keywords" rows="6" placeholder="z. B. Kunde Müller, Lieferung morgen verzögert sich, technische Probleme, Ankunft gegen 10 Uhr, entschuldigen"></textarea><div class="row"><button id="generate-new">E-Mail erstellen</button></div></section>
<section class="card"><h2>E-Mail-Vorschlag</h2><label for="new-subject">Betreff</label><input id="new-subject" placeholder="Betreff wird erstellt"><label for="new-answer">Nachricht</label><textarea id="new-answer" rows="10" placeholder="Hier erscheint die erstellte E-Mail."></textarea><div class="row"><button id="insert-new" class="secondary" disabled>In Entwurf übernehmen</button><button id="copy-new" class="secondary" disabled>Kopieren</button></div><div id="new-status" role="status" class="hint"></div></section>
</div>
</main>
<script>
const WEBHOOK_URL="https://n8n.raischflow.com/webhook/Raisch-Mail-Assistent";
const $=id=>document.getElementById(id);
let mailText="",replyItem=null,replyLoadId=0,busy=false;
function setStatus(msg,error=false){$("status").textContent=msg||"";$("status").className=error?"error":""}
function setNewStatus(msg,error=false){$("new-status").textContent=msg||"";$("new-status").className=error?"error":"hint"}
function setMode(mode){const reply=mode==="reply";$("reply-panel").hidden=!reply;$("create-panel").hidden=reply;$("tab-reply").setAttribute("aria-selected",String(reply));$("tab-create").setAttribute("aria-selected",String(!reply))}
function resetAnswer(){$("answer").value="";["open","copy","adjust"].forEach(id=>$(id).disabled=true)}
function loadItem(){const id=++replyLoadId,item=Office.context.mailbox.item;replyItem=null;mailText="";resetAnswer();$("keywords").value="";if(!item){$("mailinfo").textContent="Keine Mail ausgewählt";$("create").disabled=true;setStatus("Bitte eine E-Mail öffnen.",true);return}$("mailinfo").textContent=item.subject||"(ohne Betreff)";$("create").disabled=true;setStatus("Mail wird geladen ...");if(!item.body||!item.body.getAsync){setStatus("Mailtext ist hier nicht verfügbar.",true);return}item.body.getAsync(Office.CoercionType.Text,res=>{if(id!==replyLoadId)return;if(res.status===Office.AsyncResultStatus.Succeeded){const body=(res.value||"").trim();mailText="Betreff: "+(item.subject||"")+"\n\n"+body;replyItem=item;if(body){$("create").disabled=false;setStatus("Bereit – Vorschlag kann erstellt werden.")}else setStatus("Die E-Mail enthält keinen lesbaren Text.",true)}else setStatus("Mailtext konnte nicht gelesen werden.",true)})}
function extractAnswer(raw){let answer=raw.trim();try{const data=JSON.parse(raw);answer=data.answer??data.antwort??data.output??data.text??data.message??raw;if(typeof answer!=="string")answer=JSON.stringify(answer,null,2)}catch(_){}return answer.trim()}
async function requestAnswer(keywords,isAdjustment){if(busy)return;if(!mailText){setStatus("Die E-Mail ist noch nicht vollständig geladen.",true);return}if(isAdjustment&&!keywords.trim()){setStatus("Bitte zuerst einen Hinweis zur Anpassung eingeben.",true);$("keywords").focus();return}busy=true;$("create").disabled=true;$("adjust").disabled=true;setStatus(isAdjustment?"Antwort wird angepasst ...":"Vorschlag wird erstellt ...");try{const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mail:mailText,keywords:keywords.trim()})});if(!r.ok){const serverText=(await r.text()).trim();throw Error("Server antwortet mit Status "+r.status+(serverText?": "+serverText.slice(0,250):""))}const answer=extractAnswer(await r.text());if(!answer)throw Error("n8n hat eine leere Antwort zurückgegeben.");$("answer").value=answer;$("open").disabled=false;$("copy").disabled=false;$("adjust").disabled=false;setStatus(isAdjustment?"Antwort angepasst. Bitte vor dem Senden prüfen.":"Vorschlag erstellt. Optional unten anpassen.")}catch(e){setStatus("Fehler: "+e.message,true);$("adjust").disabled=!$("answer").value.trim()}finally{busy=false;$("create").disabled=!mailText}}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/\n/g,"<br>")}
function openReply(){if(!replyItem||typeof replyItem.displayReplyForm!=="function"){setStatus("Antwort kann nur aus einer empfangenen E-Mail geöffnet werden.",true);return}replyItem.displayReplyForm('<div style="font-family:Arial,sans-serif;font-size:11pt;">'+escapeHtml($("answer").value)+'</div><br>')}
async function copyText(value,status){try{await navigator.clipboard.writeText(value);status("In die Zwischenablage kopiert.")}catch(e){status("Bitte Text markieren und mit Strg+C kopieren.",true)}}
function parseNewMail(raw){let subject="",body="";try{const data=JSON.parse(raw);if(typeof data==="string")body=data;else if(data&&typeof data==="object"){const payload=data.output&&typeof data.output==="object"?data.output:data;subject=String(payload.subject??payload.betreff??"").trim();body=String(payload.body??payload.email??payload.answer??payload.antwort??payload.text??(typeof payload.output==="string"?payload.output:"")).trim()}}catch(_){}if(!body)body=raw.trim();const m=body.match(/^\s*(?:Betreff|Subject)\s*:\s*(.+)\r?\n/i);if(m){if(!subject)subject=m[1].trim();body=body.slice(m[0].length).trim()}return {subject,body}}
async function generateNew(){if(busy)return;const notes=$("new-keywords").value.trim();if(!notes){setNewStatus("Bitte Stichpunkte eingeben.",true);$("new-keywords").focus();return}busy=true;$("generate-new").disabled=true;setNewStatus("E-Mail wird erstellt ...");try{const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"create",mail:"",keywords:notes})});if(!r.ok)throw Error("Server antwortet mit Status "+r.status);const result=parseNewMail(await r.text());if(!result.body)throw Error("n8n hat keine E-Mail zurückgegeben.");$("new-subject").value=result.subject;$("new-answer").value=result.body;$("insert-new").disabled=false;$("copy-new").disabled=false;setNewStatus("Entwurf erstellt. Bitte Betreff und Inhalt prüfen.")}catch(e){setNewStatus("Fehler: "+e.message,true)}finally{busy=false;$("generate-new").disabled=false}}
function insertNew(){const item=Office.context.mailbox.item,subject=$("new-subject").value.trim(),body=$("new-answer").value.trim();if(!body){setNewStatus("Bitte zuerst einen Nachrichtentext erstellen.",true);return}if(!item||!item.body||typeof item.body.setAsync!=="function"){setNewStatus("Bitte zuerst in Outlook eine neue E-Mail öffnen. Der Assistent muss im Verfassen-Fenster gestartet werden.",true);return}if(!confirm("Den Nachrichtentext im aktuellen Outlook-Entwurf ersetzen?"))return;const html='<div style="font-family:Arial,sans-serif;font-size:11pt;">'+escapeHtml(body)+'</div>';item.body.setAsync(html,{coercionType:Office.CoercionType.Html},res=>{if(res.status!==Office.AsyncResultStatus.Succeeded){setNewStatus("Einfügen fehlgeschlagen: "+(res.error?.message||"Unbekannter Fehler"),true);return}if(subject&&item.subject&&typeof item.subject.setAsync==="function"){item.subject.setAsync(subject,s=>setNewStatus(s.status===Office.AsyncResultStatus.Succeeded?"Betreff und Nachricht übernommen. Bitte vor dem Senden prüfen.":"Nachricht übernommen. Betreff bitte manuell eintragen.",s.status!==Office.AsyncResultStatus.Succeeded))}else setNewStatus("Nachricht übernommen. Betreff bitte manuell eintragen.")})}
// Navigation unabhängig von der Office-Initialisierung aktivieren.
// So funktionieren die Reiter auch, wenn Outlook langsam lädt oder Office.js einen Fehler meldet.
$("tab-reply").addEventListener("click",()=>setMode("reply"));
$("tab-create").addEventListener("click",()=>setMode("create"));
$("tab-reply").addEventListener("keydown",e=>{if(e.key==="ArrowRight"){$("tab-create").focus();setMode("create")}});
$("tab-create").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){$("tab-reply").focus();setMode("reply")}});
Office.onReady(info=>{if(info.host!==Office.HostType.Outlook){setStatus("Das Add-in wurde nicht in Outlook geöffnet.",true);return}$("create").onclick=()=>requestAnswer("",false);$("adjust").onclick=()=>requestAnswer($("keywords").value,true);$("open").onclick=openReply;$("copy").onclick=()=>copyText($("answer").value,setStatus);$("generate-new").onclick=generateNew;$("insert-new").onclick=insertNew;$("copy-new").onclick=()=>copyText("Betreff: "+$("new-subject").value+"\n\n"+$("new-answer").value,setNewStatus);if(Office.context.mailbox && Office.context.mailbox.addHandlerAsync)Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged,loadItem);loadItem()}).catch(e=>setStatus("Outlook konnte nicht initialisiert werden: "+e.message,true));
</script>
</body>
</html>
