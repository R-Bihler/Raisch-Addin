<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raisch Antwort-Assistent</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --bg:#efe8e0; --card:#ffffff; --ink:#1f1b18; --muted:#7a6f66; --line:#e3dbd2;
    --field:#faf7f3; --edge:#a89a8c; --red:#c8102e; --red-dark:#a30d26; --head:#1c1917; --head-ink:#ffffff; --head-sub:#b9aea5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141210; --card:#221e1b; --ink:#f3ede7; --muted:#a89f97; --line:#3a3430;
      --field:#1a1714; --edge:#6e645b; --red:#e0384f; --red-dark:#c8102e; --head:#0d0b0a; --head-sub:#a89f97;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 Candara, Calibri, "Segoe UI", sans-serif; min-height:100vh; }

  .head { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--head); color:var(--head-ink); }
  .head img { height:46px; width:46px; object-fit:contain; background:#fff; border-radius:50%; flex:none; }
  .head h1 { margin:0; font-size:22px; line-height:1.2; font-weight:700; }
  .head p { margin:2px 0 0; font-size:14px; color:var(--head-sub); }

  main { padding:14px; display:grid; gap:12px; }
  .card { background:var(--card); border-radius:10px; padding:14px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(31,27,24,.15); }
  .card.mail { border-left:4px solid var(--red); }
  .card h2 { margin:0 0 8px; font-size:18px; font-weight:700; }
  .mailsub { color:var(--muted); font-size:14px; margin-bottom:2px; }
  #mailinfo { font-weight:700; overflow-wrap:anywhere; }

  textarea { width:100%; padding:10px; border:2px solid var(--edge); border-radius:8px; background:var(--field); color:var(--ink); font:inherit; resize:vertical; }
  textarea::placeholder { color:var(--muted); }
  textarea:focus, textarea:focus-visible { border-color:var(--red); outline:none; }
  button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }

  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--red); background:var(--red); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--red-dark); border-color:var(--red-dark); }
  button.secondary { background:transparent; color:var(--ink); border:2px solid var(--edge); }
  button.secondary:hover:not(:disabled) { background:var(--field); border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }

  #status { min-height:20px; margin-top:10px; color:var(--muted); font-size:14.5px; }
  #status.error { color:var(--red); font-weight:700; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
  <header class="head">
    <img src="logo.png" alt="Bäckerei &amp; Konditorei Raisch" onerror="this.style.display='none'">
    <div>
      <h1>Antwort-Assistent</h1>
      <p>Bäckerei &amp; Konditorei Raisch</p>
    </div>
  </header>

  <main>
    <section class="card mail">
      <div class="mailsub">Ausgewählte Mail</div>
      <div id="mailinfo">Keine Mail ausgewählt</div>
    </section>

    <section class="card">
      <h2>Antwortvorschlag</h2>
      <div class="row" style="margin-top:0; margin-bottom:10px;">
        <button id="create" disabled>Vorschlag erstellen</button>
      </div>
      <textarea id="answer" rows="10" aria-label="Antwortvorschlag"></textarea>
      <div class="row">
        <button id="open" class="secondary" disabled>Als Antwort öffnen</button>
        <button id="copy" class="secondary" disabled>Kopieren</button>
      </div>
      <div id="status" role="status"></div>
    </section>

    <section class="card">
      <h2>Antwort anpassen <span style="font-size:14px; font-weight:400; color:var(--muted);">(optional)</span></h2>
      <textarea id="keywords" rows="3" aria-label="Optionale Hinweise für die Antwort" placeholder="z. B. kürzer formulieren, 10 € Gutschein anbieten, Abholung Freitag ab 8 Uhr bestätigen"></textarea>
      <div class="row">
        <button id="adjust" disabled>Antwort anpassen</button>
      </div>
    </section>
  </main>

<script>
  const WEBHOOK_URL = "https://n8n.raischflow.com/webhook/Raisch-Mail-Assistent";
  const $ = (id) => document.getElementById(id);
  let mailText = "";

  function setStatus(msg, isError) {
    $("status").textContent = msg || "";
    $("status").className = isError ? "error" : "";
  }

  function resetAnswer() {
    $("answer").value = "";
    $("open").disabled = true;
    $("copy").disabled = true;
    $("adjust").disabled = true;
  }

  function loadItem() {
    const item = Office.context.mailbox.item;
    mailText = "";
    resetAnswer();
    $("keywords").value = "";

    if (!item) {
      $("mailinfo").textContent = "Keine Mail ausgewählt";
      $("create").disabled = true;
      setStatus("Bitte eine E-Mail öffnen.", true);
      return;
    }

    $("mailinfo").textContent = item.subject || "(ohne Betreff)";
    $("create").disabled = true;
    setStatus("Mail wird geladen ...");

    item.body.getAsync(Office.CoercionType.Text, function (res) {
      if (res.status === Office.AsyncResultStatus.Succeeded) {
        const body = (res.value || "").trim();
        mailText = "Betreff: " + (item.subject || "") + "\n\n" + body;
        if (body) {
          $("create").disabled = false;
          setStatus("Bereit – Vorschlag kann erstellt werden.");
        } else {
          setStatus("Die E-Mail enthält keinen lesbaren Text.", true);
        }
      } else {
        const detail = res.error && res.error.message ? " (" + res.error.message + ")" : "";
        setStatus("Mailtext konnte nicht gelesen werden." + detail, true);
      }
    });
  }

  function extractAnswer(raw) {
    let answer = raw.trim();
    try {
      const data = JSON.parse(raw);
      answer = data.answer ?? data.antwort ?? data.output ?? data.text ?? data.message ?? raw;
      if (typeof answer !== "string") answer = JSON.stringify(answer, null, 2);
    } catch (_) {}
    return answer.trim();
  }

  async function requestAnswer(keywords, isAdjustment) {
    if (!mailText) {
      setStatus("Die E-Mail ist noch nicht vollständig geladen.", true);
      return;
    }
    if (isAdjustment && !keywords.trim()) {
      setStatus("Bitte zuerst einen Hinweis zur Anpassung eingeben.", true);
      $("keywords").focus();
      return;
    }

    $("create").disabled = true;
    $("adjust").disabled = true;
    setStatus(isAdjustment ? "Antwort wird angepasst ..." : "Vorschlag wird erstellt ...");

    try {
      const r = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mail: mailText, keywords: keywords.trim() })
      });

      if (!r.ok) {
        const serverText = (await r.text()).trim();
        throw new Error("Server antwortet mit Status " + r.status +
          (serverText ? ": " + serverText.slice(0, 250) : ""));
      }

      const answer = extractAnswer(await r.text());
      if (!answer) throw new Error("n8n hat eine leere Antwort zurückgegeben.");

      $("answer").value = answer;
      $("open").disabled = false;
      $("copy").disabled = false;
      $("adjust").disabled = false;
      setStatus(isAdjustment
        ? "Antwort angepasst. Bitte vor dem Senden prüfen."
        : "Vorschlag erstellt. Optional unten anpassen.");
    } catch (e) {
      setStatus("Fehler: " + (e && e.message ? e.message : e), true);
      $("adjust").disabled = !$("answer").value.trim();
    } finally {
      $("create").disabled = !mailText;
    }
  }

  function createSuggestion() {
    requestAnswer("", false);
  }

  function adjustAnswer() {
    requestAnswer($("keywords").value, true);
  }

  function openReply() {
    const escaped = $("answer").value
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");

    const html =
      '<div style="font-family:Arial,sans-serif;font-size:11pt;">' +
      escaped +
      '</div><br>';

    Office.context.mailbox.item.displayReplyForm(html);
  }

  async function copyAnswer() {
    try {
      await navigator.clipboard.writeText($("answer").value);
      setStatus("In die Zwischenablage kopiert.");
    } catch (e) {
      $("answer").select();
      setStatus("Bitte mit Strg+C kopieren.", true);
    }
  }

  Office.onReady(function (info) {
    if (info.host !== Office.HostType.Outlook) {
      setStatus("Das Add-in wurde nicht in Outlook geöffnet.", true);
      return;
    }

    $("create").addEventListener("click", createSuggestion);
    $("adjust").addEventListener("click", adjustAnswer);
    $("open").addEventListener("click", openReply);
    $("copy").addEventListener("click", copyAnswer);

    if (Office.context.mailbox && Office.context.mailbox.addHandlerAsync) {
      Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, loadItem);
    }
    loadItem();
  }).catch(function (e) {
    setStatus("Outlook konnte nicht initialisiert werden: " +
      (e && e.message ? e.message : e), true);
  });
</script>
</body>
</html>
