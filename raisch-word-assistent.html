<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raisch Schriftverkehr-Assistent</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --bg:#efe8e0; --card:#ffffff; --ink:#1f1b18; --muted:#7a6f66; --line:#e3dbd2;
    --field:#faf7f3; --edge:#a89a8c; --red:#c8102e; --red-dark:#a30d26; --head:#1c1917; --head-ink:#ffffff; --head-sub:#b9aea5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141210; --card:#221e1b; --ink:#f3ede7; --muted:#a89f97; --line:#3a3430;
      --field:#1a1714; --edge:#6e645b; --red:#e0384f; --red-dark:#c8102e; --head:#0d0b0a; --head-sub:#a89f97;
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 Candara, Calibri, "Segoe UI", sans-serif; min-height:100vh; }
  .head { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--head); color:var(--head-ink); }
  .head img { height:46px; width:46px; object-fit:contain; background:#fff; border-radius:50%; flex:none; }
  .head h1 { margin:0; font-size:22px; line-height:1.2; font-weight:700; }
  .head p { margin:2px 0 0; font-size:14px; color:var(--head-sub); }
  main { padding:14px; display:grid; gap:12px; }
  .card { background:var(--card); border-radius:10px; padding:14px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(31,27,24,.15); }
  .card.accent { border-left:4px solid var(--red); }
  .card h2 { margin:0 0 8px; font-size:18px; font-weight:700; }
  label { display:block; margin:10px 0 5px; font-weight:700; }
  .hint { color:var(--muted); font-size:13.5px; margin-top:4px; }
  textarea, input, select { width:100%; padding:10px; border:2px solid var(--edge); border-radius:8px; background:var(--field); color:var(--ink); font:inherit; }
  textarea { resize:vertical; }
  textarea::placeholder, input::placeholder { color:var(--muted); }
  textarea:focus, input:focus, select:focus { border-color:var(--red); outline:none; }
  button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--red); background:var(--red); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--red-dark); border-color:var(--red-dark); }
  button.secondary { background:transparent; color:var(--ink); border:2px solid var(--edge); }
  button.secondary:hover:not(:disabled) { background:var(--field); border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }
  #status { min-height:20px; margin-top:10px; color:var(--muted); font-size:14.5px; }
  #status.error { color:var(--red); font-weight:700; }
  #preview { min-height:260px; }
  @media (prefers-reduced-motion: no-preference) { button { transition:background .15s, border-color .15s; } }
</style>
</head>
<body>
<header class="head">
  <img src="logo.png" alt="Bäckerei &amp; Konditorei Raisch" onerror="this.style.display='none'">
  <div>
    <h1>Schriftverkehr-Assistent</h1>
    <p>Bäckerei &amp; Konditorei Raisch</p>
  </div>
</header>

<main>
  <section class="card accent">
    <h2>Kundendaten</h2>
    <textarea id="kundendaten" rows="5" placeholder="z. B. Frau Anna Müller&#10;Hauptstraße 10&#10;75015 Bretten"></textarea>
    <div class="hint">Name und Anschrift einfach aus dem Kundenvorgang einfügen.</div>
  </section>

  <section class="card">
    <h2>Schreiben erstellen</h2>

    <label for="dokumentart">Dokumentart</label>
    <select id="dokumentart">
      <option>Entschuldigungsschreiben</option>
      <option>Genusskarte / Gutschein</option>
      <option>Reklamationsantwort</option>
      <option>Kundenanschreiben</option>
      <option>Angebot</option>
      <option>Allgemeines Schreiben</option>
      <option>Sonstiges</option>
    </select>

    <label for="thema">Thema</label>
    <input id="thema" type="text" placeholder="z. B. Genusskarte">

    <label for="stichpunkte">Stichpunkte / Sachverhalt</label>
    <textarea id="stichpunkte" rows="5" placeholder="z. B. 10 € Genusskarte als Entschuldigung, Kunde hatte Unannehmlichkeiten"></textarea>

    <label for="ton">Ton</label>
    <select id="ton">
      <option>freundlich und professionell</option>
      <option>freundlich und wertschätzend</option>
      <option>kurz und sachlich</option>
      <option>besonders persönlich</option>
    </select>

    <div class="row">
      <button id="create">Schreiben erstellen</button>
    </div>
    <div id="status" role="status">Bereit – Schreiben kann erstellt werden.</div>
  </section>

  <section class="card">
    <h2>Vorschau</h2>
    <textarea id="preview" rows="14" aria-label="Vorschau des Schreibens"></textarea>
    <div class="row">
      <button id="insert" class="secondary" disabled>In Word einfügen</button>
      <button id="copy" class="secondary" disabled>Kopieren</button>
    </div>
  </section>
</main>

<script>
  const WEBHOOK_URL = "https://n8n.raischflow.com/webhook/raisch-word";
  const $ = (id) => document.getElementById(id);

  function setStatus(msg, isError) {
    $("status").textContent = msg || "";
    $("status").className = isError ? "error" : "";
  }

  function setBusy(isBusy) {
    $("create").disabled = isBusy;
    if (isBusy) {
      $("insert").disabled = true;
      $("copy").disabled = true;
    }
  }

  function extractText(raw) {
    let text = raw.trim();
    try {
      const data = JSON.parse(raw);
      text = data.text ?? data.output ?? data.answer ?? data.antwort ?? data.message ?? raw;
      if (typeof text !== "string") text = JSON.stringify(text, null, 2);
    } catch (_) {}
    return text.trim();
  }

  async function createLetter() {
    const payload = {
      kundendaten: $("kundendaten").value.trim(),
      dokumentart: $("dokumentart").value,
      thema: $("thema").value.trim(),
      stichpunkte: $("stichpunkte").value.trim(),
      ton: $("ton").value
    };

    if (!payload.kundendaten) {
      setStatus("Bitte Kundendaten eingeben.", true);
      $("kundendaten").focus();
      return;
    }
    if (!payload.thema && !payload.stichpunkte) {
      setStatus("Bitte mindestens Thema oder Stichpunkte eingeben.", true);
      $("thema").focus();
      return;
    }

    setBusy(true);
    setStatus("Schreiben wird erstellt ...");
    $("preview").value = "";

    try {
      const r = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify(payload)
      });

      if (!r.ok) {
        const serverText = (await r.text()).trim();
        throw new Error("Server antwortet mit Status " + r.status + (serverText ? ": " + serverText.slice(0, 250) : ""));
      }

      const text = extractText(await r.text());
      if (!text) throw new Error("n8n hat eine leere Antwort zurückgegeben.");

      $("preview").value = text;
      $("insert").disabled = false;
      $("copy").disabled = false;
      setStatus("Schreiben erstellt. Bitte prüfen und anschließend in Word einfügen.");
    } catch (e) {
      setStatus("Fehler: " + (e && e.message ? e.message : e), true);
    } finally {
      $("create").disabled = false;
    }
  }

  async function insertIntoWord() {
    const text = $("preview").value.trim();
    if (!text) return;

    try {
      await Word.run(async (context) => {
        const body = context.document.body;
        body.insertText(text, Word.InsertLocation.replace);
        await context.sync();
      });
      setStatus("Schreiben wurde in Word eingefügt.");
    } catch (e) {
      setStatus("Word-Einfügen fehlgeschlagen: " + (e && e.message ? e.message : e), true);
    }
  }

  async function copyText() {
    try {
      await navigator.clipboard.writeText($("preview").value);
      setStatus("In die Zwischenablage kopiert.");
    } catch (e) {
      $("preview").select();
      setStatus("Bitte mit Strg+C kopieren.", true);
    }
  }

  Office.onReady(function (info) {
    if (info.host !== Office.HostType.Word) {
      setStatus("Das Add-in wurde nicht in Word geöffnet.", true);
      $("create").disabled = true;
      return;
    }

    $("create").addEventListener("click", createLetter);
    $("insert").addEventListener("click", insertIntoWord);
    $("copy").addEventListener("click", copyText);
  }).catch(function (e) {
    setStatus("Word konnte nicht initialisiert werden: " + (e && e.message ? e.message : e), true);
  });
</script>
</body>
</html>
